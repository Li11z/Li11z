name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/contrib-3d.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render the 3D contribution graph
        run: python3 scripts/contrib_3d.py
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Save it to assets
        run: |
          mkdir -p assets
          cp dist/contrib-3d.svg assets/contrib-3d.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d.svg
          git diff --cached --quiet || git commit -m "Update 3D contribution graph [skip ci]"
          git push